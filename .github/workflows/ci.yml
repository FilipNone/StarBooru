# The gate from AGENTS.md › Before you finish a task.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  server:
    name: Server and libraries
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: starbooru
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: starbooru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starbooru"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STARBOORU_TEST_DATABASE_URL: postgres://starbooru:ci-only@127.0.0.1:5432/starbooru
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude starbooru-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude starbooru-app

  app:
    name: App
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install the desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev libxdo-dev librsvg2-dev
      - run: cargo test -p starbooru-app --no-default-features --features desktop
      - run: cargo clippy -p starbooru-app --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings
      - run: cargo clippy -p starbooru-app --no-default-features --features desktop -- -D warnings
