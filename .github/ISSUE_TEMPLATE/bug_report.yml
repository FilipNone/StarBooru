name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Upload page
        2. Choose a folder
        3. ...
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Web
        - Desktop on Windows
        - Desktop on Linux
        - Desktop on macOS
        - Android
        - Server or Docker
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Settings › Administration shows the server version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, passwords and addresses you'd rather keep private. Please don't attach personal pictures.
      render: text
