[package]
name = "starbooru-server"
description = "StarBooru self-hosted server: JSON API, media storage, web app hosting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
starbooru-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "time", "process", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "limit", "catch-panic", "compression-gzip", "compression-br", "set-header"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "migrate"] }

argon2 = "0.6"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
flate2 = "1"
# The strongest setting, for `precompress`; tower-http brings the same crate.
brotli = "9"
tar = "0.4"
whatlang = "0.18"
rand = "0.10"
infer = "0.19"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url = { version = "2", features = ["serde"] }
percent-encoding = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "rayon"] }
kamadak-exif = "0.6.1"
rayon = "1.12"

[dev-dependencies]
tempfile = "3"
# A body that arrives in pieces, for the download progress test.
futures-util = { version = "0.3", default-features = false }

[lints]
workspace = true
