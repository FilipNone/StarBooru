[application]
name = "starbooru"

[web.app]
title = "StarBooru"

[bundle]
identifier = "eu.filipnone.starbooru"
publisher = "StarBooru"
short_description = "Self-hosted personal booru"
category = "Graphics"
icon = [
  "icons/icon-32.png",
  "icons/icon-128.png",
  "icons/icon-256.png",
  "icons/icon-512.png",
  "icons/icon.ico",
  "icons/icon.icns",
]

# dx writes no dependencies by itself, and the app can't start without these.
# The GStreamer plugins are what WebKit plays videos with.
[bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libsoup-3.0-0", "libxdo3", "libssl3"]
recommends = ["gstreamer1.0-plugins-good", "gstreamer1.0-libav"]
