<!DOCTYPE html>
<html>
  <head>
    <title>{app_title}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
      /* The loading screen, over the page until the app is on it (main.css takes
         it away). It is styled here so that it paints before anything has
         loaded. The colours are main.css's --canvas, --primary-container and
         --primary: a test in main.rs keeps the two the same. */
      #boot {
        --h: 285;
        --canvas: oklch(0.985 0.006 var(--h));
        --primary-container: oklch(0.9 0.06 var(--h));
        --primary: oklch(0.5 0.17 var(--h));
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: var(--canvas);
      }
      #boot[data-theme="dark"] {
        --canvas: oklch(0.165 0.012 var(--h));
        --primary-container: oklch(0.37 0.1 var(--h));
        --primary: oklch(0.8 0.11 var(--h));
      }
      @media (prefers-color-scheme: dark) {
        #boot:not([data-theme="light"]) {
          --canvas: oklch(0.165 0.012 var(--h));
          --primary-container: oklch(0.37 0.1 var(--h));
          --primary: oklch(0.8 0.11 var(--h));
        }
      }
      /* The ring waits a moment. A start that takes less shows the plain
         colour and then the app, without a ring flashing in between. */
      #boot::after {
        content: ""; width: 32px; height: 32px; border-radius: 50%;
        border: 4px solid var(--primary-container); border-top-color: var(--primary);
        opacity: 0; animation: boot-spin 0.8s linear infinite, boot-show 0.2s 0.4s forwards;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-show { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <div id="boot" aria-hidden="true"></div>
    <script>
      // The theme and the colour picked in Settings, as the app keeps them.
      try {
        const prefs = JSON.parse(localStorage.getItem("starbooru") ?? "{}").prefs ?? {};
        const boot = document.getElementById("boot");
        if (prefs.theme === "dark" || prefs.theme === "light") boot.dataset.theme = prefs.theme;
        if (Number.isFinite(prefs.accent_hue)) boot.style.setProperty("--h", prefs.accent_hue);
      } catch {}
    </script>
    <!-- The stylesheet, which `dx` links here. After the loading screen, so
         the screen doesn't wait for it. -->
    {style_include}
  </body>
</html>
