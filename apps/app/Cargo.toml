[package]
name = "starbooru-app"
description = "StarBooru client: web, desktop (Windows/Linux/macOS) and Android from one Dioxus codebase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
starbooru-core.workspace = true
starbooru-client.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes = "1"
chrono = { workspace = true, features = ["wasmbind"] }
dioxus = { version = "0.7", features = ["router"] }
fluent-bundle = "0.16"
# One search goes to several boorus at once.
futures-util = "0.3"
unic-langid = "0.9"
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "Blob", "File"] }
sys-locale = { version = "0.3", features = ["js"] }
# The start of a chosen file, without reading the rest.
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"
# Provider sign-in: the system browser and a loopback listener for its answer.
# The media cache: files and downloads.
tokio = { version = "1", features = ["fs", "rt", "net", "io-util", "time"] }
webbrowser = "1"

[target.'cfg(target_os = "android")'.dependencies]
# The app's folders and the wallpaper colour come from Java's `Context`.
jni = "0.21"
robius-android-env = "0.2"

[dev-dependencies]
fluent-syntax = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints]
workspace = true
