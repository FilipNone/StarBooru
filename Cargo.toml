[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/core", "crates/client", "apps/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/FilipNone/StarBooru"

[workspace.dependencies]
starbooru-core = { path = "crates/core" }
starbooru-client = { path = "crates/client" }

chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dioxus web builds: small wasm
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
lto = true
