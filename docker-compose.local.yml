# Local override: publish the web interface on http://localhost:8080
# (or STARBOORU_PORT; the VS Code runner uses 8090 so it doesn't clash with the dev server).
services:
  starbooru:
    ports:
      - "${STARBOORU_PORT:-8080}:8080"
    environment:
      # Published directly, so X-Forwarded-For would come from the client.
      STARBOORU_TRUST_PROXY: "false"
