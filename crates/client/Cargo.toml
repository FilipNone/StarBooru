[package]
name = "starbooru-client"
description = "Typed HTTP client for the StarBooru API (native and wasm)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
starbooru-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes = "1"
chrono.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset"] }
tokio = { version = "1", features = ["time", "fs", "io-util"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util"] }

[lints]
workspace = true
