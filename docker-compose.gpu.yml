# Local AI on AMD and Intel graphics, or NVIDIA's Vulkan driver:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Where /dev/dri/renderD128 isn't open to everyone, set STARBOORU_RENDER_GID to
# its group: stat -c %g /dev/dri/renderD128
services:
  starbooru:
    image: ghcr.io/filipnone/starbooru:${STARBOORU_VERSION:-latest}-vulkan
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${STARBOORU_RENDER_GID:-44}"
